name: 原帖媒体健康检查
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    if: github.repository == 'guanmo-ai/awesome-ai-motion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 检查原帖 MP4 响应（非完整播放或质量审查）
        run: node scripts/check-media.mjs
